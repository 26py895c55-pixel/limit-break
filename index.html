<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Limit Break</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Limit Break">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0f26">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Tektur:wght@500;700;900&display=swap">
<style>html{background:#0c0f26}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: einspaltige Handy-App. HUD oben, Wochen-Quest als Held, Verlauf darunter, Tabs unten.
   Formsprache: angeschrägte Ecken statt Rundungen. Farbe nur für Daten und Status. */
:root{
  color-scheme:dark;
  --bg:#0c0f26; --surface:#161a36; --surface2:#20264d; --line:#303768;
  --text:#eef0ff; --muted:#9ba2d0;
  --accent:#f5c542; --accent-ink:#1b1400;
  --kraft:#e26c1c; --rad:#10a0c2; --andere:#9070f0;
  --gold:#f5c542; --silver:#b9c4dc; --fail:#ef5a6f;
  --f-display:'Tektur','Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-label:'Barlow Condensed','Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;
}
:root[data-skin="nacht"]{--bg:#061a1f;--surface:#0d2a31;--surface2:#143a43;--line:#1f515c;--text:#e9fbff;--muted:#86b3bd;--accent:#6cf0c2;--accent-ink:#00241a}
:root[data-skin="keller"]{--bg:#17120f;--surface:#231b16;--surface2:#30251e;--line:#47372c;--text:#fff3e8;--muted:#b9a391;--accent:#ffb347;--accent-ink:#2a1500}
:root[data-skin="handheld"]{--bg:#0f1a0f;--surface:#17261a;--surface2:#203524;--line:#2f4d33;--text:#d9f2c4;--muted:#8fb07f;--accent:#b6e35a;--accent-ink:#142100}
:root[data-skin="kristall"]{--bg:#03062b;--surface:#10217a;--surface2:#1c319c;--line:#c9d2f5;--rule:#3348b8;--text:#fff;--muted:#b4c0ee;--accent:#ffe066;--accent-ink:#1b1400}
:root[data-skin="kristall"] .panel::before{background:linear-gradient(#1a2fa6,#0a1463)}
:root[data-skin="fenster"]{--bg:#0b0b0b;--surface:#161616;--surface2:#272727;--line:#f2f2f2;--rule:#3a3a3a;--text:#fff;--muted:#a9a9a9;--accent:#fff;--accent-ink:#000}
:root[data-skin="fenster"] .panel::before{background:#000}
:root[data-skin="gold"]{--bg:#0b0a08;--surface:#17140d;--surface2:#221d12;--line:#4a3d1a;--text:#fff8e1;--muted:#b5a888;--accent:#ffd24a;--accent-ink:#221700}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.17;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;
  -webkit-mask-image:linear-gradient(#000,transparent 72%);mask-image:linear-gradient(#000,transparent 72%)}
.wrap{position:relative;z-index:1;max-width:520px;margin-inline:auto;padding-inline:16px;padding-block:0 88px}
main>section{display:flex;flex-direction:column;gap:14px}

/* Panel mit angeschrägten Ecken */
.panel{position:relative;--cut:14px;background:var(--line);padding:16px;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.panel::before{content:"";position:absolute;inset:1px;background:var(--surface);clip-path:inherit;z-index:0}
.panel>*{position:relative;z-index:1}
.lbl{font:600 13px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h2{font:700 18px/1.2 var(--f-display);letter-spacing:.02em;text-wrap:balance}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:10px;margin-inline:-16px;padding-inline:16px;
  background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:14px}
.hud::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
.hex{clip-path:polygon(50% 0,96% 25%,96% 75%,50% 100%,4% 75%,4% 25%)}
.emblem{width:46px;height:50px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:900 22px/1 var(--f-display);flex:none}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rank{display:flex;align-items:baseline;gap:8px;font:700 16px/1.1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank small{font:600 12px var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.xpbar{height:8px;background:var(--surface2);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.xpnum{font:500 12px/1 var(--f-label);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px}
.streak b{display:flex;align-items:center;gap:3px;font:700 20px/1 var(--f-display)}
.streak b svg{color:var(--kraft)}
.streak.zero b svg{color:var(--muted)}
.streak span{font:600 11px/1 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;margin-bottom:14px;background:var(--surface2);border-left:3px solid var(--accent);font-size:14px}
.banner button{font:600 13px var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);min-height:36px;padding-inline:8px;flex:none}

/* Wochenkarte */
.hero.s-gold{filter:drop-shadow(0 0 14px rgba(245,197,66,.28))}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font:600 12px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.count{font:900 52px/.9 var(--f-display);letter-spacing:-.01em}
.count small{font-size:24px;font-weight:700;color:var(--muted)}
.medals{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.mchip{display:flex;align-items:center;gap:5px;font:600 12px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;padding:7px 8px;border:1px solid var(--line);color:var(--muted)}
.mchip svg{width:14px;height:14px}
.mchip.on.gold{border-color:var(--gold);color:var(--text)}
.mchip.on.silver{border-color:var(--silver);color:var(--text)}
.segs{display:flex;gap:4px;margin-top:14px}
.seg{flex:1;height:14px;background:var(--surface2);transform:skewX(-14deg);transition:background .3s}
.seg.on{background:var(--c)}
.seg.pop{animation:segpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes segpop{0%{transform:skewX(-14deg) scaleY(.3)}60%{transform:skewX(-14deg) scaleY(1.7)}100%{transform:skewX(-14deg) scaleY(1)}}
.hero-msg{margin-top:12px;font-weight:600;font-size:16px}
.hero-msg.gold{color:var(--gold)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;min-height:58px;background:var(--surface2);color:var(--muted)}
.day .wd{font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase}
.day .dn{font:700 15px/1 var(--f-display);color:var(--text)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:3px;min-height:7px}
.dots i{width:7px;height:7px;background:var(--c);transform:rotate(45deg)}

/* Quests */
.qgroup{display:flex;flex-direction:column;gap:6px}
.qhead{display:flex;align-items:center;gap:8px;color:var(--muted);margin-top:4px}
.qhead svg{color:var(--c)}
.qhead .n{margin-left:auto;font-variant-numeric:tabular-nums}
.quest{display:flex;align-items:stretch;gap:0;background:var(--surface);border-left:3px solid var(--c);min-height:62px}
.chk{width:60px;flex:none;display:grid;place-items:center}
.chk span{width:38px;height:38px;display:grid;place-items:center;border:2px solid var(--c);color:transparent;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);background:transparent;transition:background .2s}
.chk span svg{width:22px;height:22px;stroke-width:3}
.quest.done .chk span{background:var(--c);color:#0b0d1c}
.quest.just .chk span{animation:pop .45s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.qbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 6px 8px 0}
.qname{font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.qsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qxp{align-self:center;padding-right:12px;font:600 13px var(--f-label);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.quest.done .qxp{color:var(--text)}
.addrow{display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;font:600 16px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;
  background:var(--surface2);color:var(--text);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{display:flex;width:100%}
.btn.danger{color:var(--fail)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.emblem:focus-visible,.uchip:focus-visible{filter:brightness(1.3)}
.mini{font:600 13px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);min-height:36px;padding-inline:8px}

/* Verlauf */
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px;color:var(--muted)}
.tally span{display:inline-flex;align-items:center;gap:5px}
.tally b{color:var(--text);font:700 15px var(--f-display)}
.tally svg{width:14px;height:14px}
.chart{margin-top:10px;position:relative;min-height:60px}
.chart svg{display:block;max-width:100%}
.grid{stroke:var(--rule,var(--line));stroke-width:1}
.tick,.mon{fill:var(--muted);font:500 11px var(--f-label);letter-spacing:.04em}
.target{stroke:var(--text);stroke-opacity:.5;stroke-width:1.5}
.selcol{fill:var(--surface2)}
.c-kraft{fill:var(--kraft)}.c-rad{fill:var(--rad)}.c-andere{fill:var(--andere)}
.m-gold{fill:var(--gold)}.m-silver{fill:var(--silver)}
.m-fail{stroke:var(--fail);stroke-width:2;stroke-linecap:round;fill:none}
.m-muted{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;fill:none}
.m-dot{fill:var(--rule,var(--line))}
.catlegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px;color:var(--muted)}
.catlegend span{display:inline-flex;align-items:center;gap:6px}
.catlegend i{width:10px;height:10px;background:var(--c);border-radius:2px}
.catlegend i.line{height:2px;width:14px;background:var(--text);opacity:.5;border-radius:0}
.readout{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule,var(--line))}
.readout .r1{font:700 15px var(--f-display)}
.readout .r2{font-size:14px;color:var(--muted)}
.empty{padding:18px 4px 6px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.wlist{display:flex;flex-direction:column}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule,var(--line));width:100%;min-height:52px}
.wrow .a{flex:none;width:92px}
.wrow .a b{display:block;font:700 15px var(--f-display)}
.wrow .a span{font-size:12px;color:var(--muted)}
.wrow .dots{flex:1;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--text);white-space:nowrap}
.badge svg{width:14px;height:14px}
.badge.dim{color:var(--muted)}

/* Trophäen */
.rankcard{display:flex;gap:14px;align-items:center}
.bighex{width:84px;height:92px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:900 40px/1 var(--f-display);flex:none}
.rankcard .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rankcard .xpbar{height:10px}
.note{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.stat b{font:700 26px/1 var(--f-display)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trophy{background:var(--surface);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.thex{width:54px;height:60px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.thex svg{width:26px;height:26px}
.trophy.on .thex{background:var(--c);color:#0b0d1c}
.tname{font:600 13px/1.15 var(--f-body);-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.trophy:not(.on) .tname{color:var(--muted)}
.tprog{width:100%;height:4px;background:var(--surface2)}
.tprog i{display:block;height:100%;background:var(--muted)}
.tsub{font:500 12px/1 var(--f-label);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.skin{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);min-height:60px;min-width:0}
.skin .sw{width:34px;height:34px;flex:none;position:relative;border:1px solid var(--line)}
.skin .sw::after{content:"";position:absolute;right:0;bottom:0;width:60%;height:60%;background:var(--sa);clip-path:polygon(100% 0,100% 100%,0 100%)}
.skin .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.skin .t b{font:600 15px/1.1 var(--f-body)}
.skin .t span{font-size:12px;color:var(--muted)}
.skin.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
.skin.locked{opacity:.6}

/* Plan */
.catblock{display:flex;flex-direction:column;gap:8px}
.unit{background:var(--surface);border-left:3px solid var(--c);padding:10px 10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.uname{width:100%;min-width:0;background:var(--surface2);border:1px solid transparent;padding:10px 12px;font-weight:600;font-size:17px;border-radius:0}
.uname:focus{border-color:var(--accent);outline:none}
.urow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:44px;height:44px;background:var(--surface2);font:700 22px/1 var(--f-display);display:grid;place-items:center}
.stepper output{min-width:104px;text-align:center;font:600 15px var(--f-label);letter-spacing:.08em;text-transform:uppercase}
.del{min-height:44px;padding-inline:10px;color:var(--muted);font:600 13px var(--f-label);letter-spacing:.1em;text-transform:uppercase}
.del[data-armed]{color:var(--fail)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{width:54px;height:30px;background:var(--surface2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(24px);background:var(--accent-ink)}
.stack{display:flex;flex-direction:column;gap:10px}
.sync{font-size:14px;color:var(--muted)}
.sync.err{color:var(--fail)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;max-width:520px;margin-inline:auto}
.tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:600 12px/1 var(--f-label);letter-spacing:.12em;text-transform:uppercase;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected=true]{color:var(--accent)}
.tab[aria-selected=true]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(3,4,12,.72);animation:fade .2s}
.sheet-box{position:relative;width:100%;max-width:520px;padding:0;--cut:18px;animation:up .28s cubic-bezier(.2,.9,.2,1);
  clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut))}
.sheet-scroll{max-height:86vh;max-height:86dvh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{width:44px;height:44px;margin:-10px -8px 0 0;display:grid;place-items:center;color:var(--muted);flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{background:var(--surface2);border:1px solid var(--line);padding:12px;font-size:16px;border-radius:0;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.uchips{display:flex;flex-wrap:wrap;gap:6px}
.uchip{min-height:44px;padding:8px 12px;background:var(--surface2);border-left:3px solid var(--c);font-weight:600;font-size:15px;color:var(--muted)}
.uchip[aria-pressed=true]{background:var(--c);color:#0b0d1c}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1;padding-inline:8px;letter-spacing:.06em;white-space:nowrap;min-width:0}
.wk-slot{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 10px;background:var(--surface2);border-left:3px solid var(--c);width:100%}
.wk-slot .t{flex:1;min-width:0}
.wk-slot .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.wk-slot .t span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-slot.miss{border-left-color:var(--line)}
.wk-slot.miss b{color:var(--muted)}
.wk-slot .go{font:600 12px var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex:none}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:35;max-width:488px;margin-inline:auto;
  display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;background:var(--text);color:var(--bg);font-weight:600;font-size:15px;animation:up .25s;

@keyframes drop{0%{transform:translateY(-70px) scale(.4) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}

@keyframes stamp{0%{transform:scale(2.4);opacity:0;letter-spacing:.4em}100%{transform:none;opacity:1}}

#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

<script>
(() => {
'use strict';

/* ---------- Grundlagen ---------- */
const LS_KEY = 'trainingsquest.v1';
const CATS = [
  {id:'kraft', name:'Kraft', icon:'dumbbell'},
  {id:'rad', name:'Rad', icon:'bike'},
  {id:'andere', name:'Andere', icon:'pulse'}
];
const CAT_IDS = CATS.map(c => c.id);
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const RANKS = ['Rookie','Aufsteiger','Herausforderer','Tank','Gipfelstürmer','Paladin','Wattmonster','Maschine','Endgegner','Epic Hero'];
const XP = {unit:100, bonus:50, silver:100, gold:300, pr:50};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const mondayOf = k => addDays(k, -((dateOf(k).getDay() + 6) % 7));
const todayKey = () => keyOf(new Date());
const dayDiff = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const isoWeek = k => { const d = dateOf(k); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const fmtDay = k => { const d = dateOf(k); return WD[(d.getDay() + 6) % 7] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
const fmtRange = m => { const a = dateOf(m), b = dateOf(addDays(m, 6)); return a.getMonth() === b.getMonth() ? a.getDate() + '.–' + b.getDate() + '. ' + MON[b.getMonth()] : a.getDate() + '. ' + MON[a.getMonth()] + ' – ' + b.getDate() + '. ' + MON[b.getMonth()]; };
const fmtNum = n => n.toLocaleString('de-DE');
const newId = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const ICONS = {
  dumbbell:'<path d="M3 9v6M6.5 6v12M17.5 6v12M21 9v6M6.5 12h11"/>',
  bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8l4 8M9 5h3"/>',
  pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/>',
  flame:'<path d="M12 3c.5 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.500 0 1.500 .800 2.500 1.500 3C11 9 10.500 6 12 3z"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/>',
  medal:'<circle cx="12" cy="15" r="5"/><path d="M9 3l3 7 3-7"/>',
  bolt:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  bars:'<path d="M5 20V11M12 20V4M19 20v-6M3 20h18"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  lock:'<rect x="6" y="11" width="12" height="9" rx="1"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>',
  crown:'<path d="M4 18h16M4 15L3 7l5 4 4-6 4 6 5-4-1 8z"/>',
  repeat:'<path d="M4 11a8 8 0 0 1 14-4l2 2M20 5v4h-4M20 13a8 8 0 0 1-14 4l-2-2M4 19v-4h4"/>',
  sunrise:'<path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M5.500 9.500l2 2M18.500 9.500l-2 2"/>',
  hourglass:'<path d="M7 4h10M7 20h10M8 4v3l8 10v3M16 4v3L8 17v3"/>',
  layers:'<path d="M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/>',
  up:'<path d="M12 20V5M6 11l6-6 6 6M5 20h14"/>',
  twin:'<circle cx="8" cy="12" r="4"/><circle cx="16" cy="12" r="4"/>',
  calendar:'<rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 10h16M8 3v4M16 3v4"/>'
};
const ic = n => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';
const starPts = (cx, cy, R, r) => { let p = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; p += (cx + Math.cos(a) * q).toFixed(1) + ',' + (cy + Math.sin(a) * q).toFixed(1) + ' '; } return p.trim(); };
const glyph = (status, cx, cy, big) => {
  const k = big ? 1.25 : 1;
  switch (status) {
    case 'gold': return '<polygon class="m-gold" points="' + starPts(cx, cy, 6 * k, 2.6 * k) + '"/>';
    case 'silber': return '<circle class="m-silver" cx="' + cx + '" cy="' + cy + '" r="' + 3.4 * k + '"/>';
    case 'fail': return '<path class="m-fail" d="M' + (cx - 3) + ' ' + (cy - 3) + 'l6 6M' + (cx + 3) + ' ' + (cy - 3) + 'l-6 6"/>';
    case 'pause': case 'frei': return '<path class="m-muted" d="M' + (cx - 2) + ' ' + (cy - 3) + 'v6M' + (cx + 2) + ' ' + (cy - 3) + 'v6"/>';
    case 'offen': return '<circle class="m-muted" cx="' + cx + '" cy="' + cy + '" r="3"/>';
    default: return '<circle class="m-dot" cx="' + cx + '" cy="' + cy + '" r="1.2"/>';
  }
};
const glyphSvg = s => '<svg viewBox="0 0 14 14" aria-hidden="true">' + glyph(s, 7, 7) + '</svg>';
const STATUS_LABEL = {gold:'Limit Break', silber:'Achtungserfolg', fail:'Besiegt', pause:'Rast', frei:'Kein Plan', offen:'Läuft'};
const badge = s => '<span class="badge' + (s === 'gold' || s === 'silber' || s === 'fail' ? '' : ' dim') + '">' + glyphSvg(s) + STATUS_LABEL[s] + '</span>';

/* ---------- Zustand ---------- */
function defaults() {
  return {
    v:1, updatedAt:0,
    units:[
      {id:'u1', cat:'kraft', name:'Freihanteltraining'},
      {id:'u2', cat:'kraft', name:'Les Mills Bodypump'},
      {id:'u3', cat:'rad', name:'Rad intensiv'},
      {id:'u4', cat:'rad', name:'Rad locker'}
    ],
    plans:[{from:'2000-01-03', t:{u1:1, u2:1, u3:1, u4:1}}],
    log:[], ach:{}, fx:{gold:[], silver:[], recap:''}, skip:[],
    lifts:[{id:'x1', name:'Kreuzheben', unit:'kg', step:2.5}, {id:'x2', name:'Bankdrücken', unit:'kg', step:2.5}, {id:'x3', name:'Klimmzüge', unit:'wdh', step:1}], sets:[],
    settings:{skin:'arcade', sound:true, loud:false}
  };
}
function normalize(s) {
  const d = defaults();
  if (!s || typeof s !== 'object') return d;
  const o = {v:1, updatedAt:+s.updatedAt || 0};
  o.units = Array.isArray(s.units) ? s.units.filter(u => u && u.id && CAT_IDS.includes(u.cat)).map(u => Object.assign({id:String(u.id), cat:u.cat, name:String(u.name || 'Einheit').slice(0, 40)}, u.archived ? {archived:true} : {})) : d.units;
  const plans = Array.isArray(s.plans) ? s.plans.filter(p => p && DATE_RE.test(p.from) && p.t && typeof p.t === 'object').map(p => ({from:p.from, t:Object.fromEntries(Object.entries(p.t).map(([k, v]) => [k, Math.max(0, Math.min(14, v | 0))]))})) : [];
  plans.sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  o.plans = plans.length ? plans : d.plans;
  o.log = Array.isArray(s.log) ? s.log.filter(e => e && DATE_RE.test(e.d) && e.u).map(e => Object.assign({id:String(e.id || newId()), d:e.d, u:String(e.u)}, e.note ? {note:String(e.note).slice(0, 200)} : {})) : [];
  o.ach = {};
  if (s.ach && typeof s.ach === 'object') for (const k of Object.keys(s.ach)) if (DATE_RE.test(s.ach[k])) o.ach[k] = s.ach[k];
  const fx = s.fx || {};
  const dates = a => Array.isArray(a) ? a.filter(x => DATE_RE.test(x)) : [];
  o.fx = {gold:dates(fx.gold), silver:dates(fx.silver), recap:DATE_RE.test(fx.recap) ? fx.recap : ''};
  o.skip = dates(s.skip);
  o.lifts = Array.isArray(s.lifts) ? s.lifts.filter(x => x && x.id && x.name).map(x => Object.assign({id:String(x.id), name:String(x.name).slice(0, 40), unit:x.unit === 'wdh' ? 'wdh' : 'kg', step:Math.max(.25, Math.min(50, +x.step || (x.unit === 'wdh' ? 1 : 2.5)))}, x.archived ? {archived:true} : {})) : d.lifts;
  o.sets = Array.isArray(s.sets) ? s.sets.filter(e => e && DATE_RE.test(e.d) && e.x && isFinite(+e.v) && +e.v >= 0).map(e => Object.assign({id:String(e.id || newId()), d:e.d, x:String(e.x), v:+e.v}, e.note ? {note:String(e.note).slice(0, 200)} : {})) : [];
  const st = s.settings || {};
  o.settings = {skin:typeof st.skin === 'string' ? st.skin : 'arcade', sound:st.sound !== false, loud:st.loud === true};
  return o;
}

let state = defaults();
let D = null;                 // abgeleitete Werte
let ready = false, demo = false, backup = null;
let tab = 'start', histMode = 'chart', selWeek = null, sheet = null;
let cacheDirty = false, tomb = [];
let sync = 'loading';         // loading | cloud | local | error
let docRef = null, lastPt = null;

/* ---------- Ableitung: Wochen, XP, Serien ---------- */
const planFor = (st, m) => { let p = st.plans[0]; for (const x of st.plans) if (x.from <= m) p = x; return p.t; };
const orderedUnits = st => { const r = []; for (const c of CATS) for (const u of st.units) if (u.cat === c.id) r.push(u); return r; };

function weekInfo(st, m, raw, unitMap, skip, curM) {
  const t = planFor(st, m);
  const entries = raw.slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  const need = {}; let total = 0;
  for (const u of st.units) { const n = t[u.id] | 0; if (n > 0) { need[u.id] = n; total += n; } }
  const used = {}, per = {}, bonus = [], cats = {kraft:0, rad:0, andere:0}, days = {};
  let done = 0, completeDate = null;
  for (const e of entries) {
    const u = unitMap.get(e.u);
    cats[u ? u.cat : 'andere']++;
    days[e.d] = (days[e.d] || 0) + 1;
    used[e.u] = (used[e.u] || 0) + 1;
    if (used[e.u] <= (need[e.u] || 0)) { done++; (per[e.u] = per[e.u] || []).push(e); if (done === total) completeDate = e.d; }
    else bonus.push(e);
  }
  const slots = [];
  for (const u of orderedUnits(st)) for (let i = 0; i < (need[u.id] || 0); i++) slots.push({unit:u, i, n:need[u.id], entry:(per[u.id] || [])[i] || null});
  const missing = total - done, over = m < curM;
  const medal = total === 0 ? 'frei' : missing === 0 ? 'gold' : (missing === 1 && done >= 1) ? 'silber' : 'none';
  const status = medal === 'gold' || medal === 'silber' ? medal : skip.has(m) ? 'pause' : medal === 'frei' ? 'frei' : over ? 'fail' : 'offen';
  const xp = done * XP.unit + bonus.length * XP.bonus + (medal === 'gold' ? XP.gold : medal === 'silber' ? XP.silver : 0);
  return {m, entries, slots, bonus, cats, days, total, done, missing, count:entries.length, over, status, xp, completeDate, paused:skip.has(m)};
}

const levelOf = xp => Math.floor((1 + Math.sqrt(1 + xp / 62.5)) / 2);
const xpAt = L => 250 * L * (L - 1);
const rankOf = L => L <= RANKS.length ? RANKS[L - 1] : 'Epic Hero +' + (L - RANKS.length);

// Eisen-Log: Bestwerte je Übung; ein Eintrag über dem bisherigen Bestwert zählt als Rekord.
function liftStats(st) {
  const by = {}, prIds = new Set(); let prs = 0, kg100 = 0, reps10 = 0;
  const sorted = st.sets.slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.id < b.id ? -1 : 1);
  for (const e of sorted) {
    const b = by[e.x] || (by[e.x] = {list:[], best:null});
    if (b.best && e.v > b.best.v) { prs++; prIds.add(e.id); }
    if (!b.best || e.v > b.best.v) b.best = e;
    b.list.push(e);
  }
  for (const x of st.lifts) { const b = by[x.id]; if (!b) continue; if (x.unit === 'kg' && b.best.v >= 100) kg100 = 1; if (x.unit === 'wdh' && b.best.v >= 10) reps10 = 1; }
  return {by, prIds, prs, kg100, reps10};
}

/* ---------- Speichern ---------- */
function saveLocal() {
  if (demo) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({state, dirty:cacheDirty, tomb})); } catch (e) {}
}
function loadLocal() {
  try { const c = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (c && c.state) return c; } catch (e) {}
  return null;
}
function setSync(v) { sync = v; const el = $('#syncline'); if (el) el.outerHTML = syncHTML(); }
let writing = false, again = false, retried = false, remoteKnown = false, subscribed = false;
function subscribe() {
  if (subscribed || !docRef) return;
  subscribed = true;
  docRef.onSnapshot(sn => {
    if (!sn.exists || sn.metadata.hasPendingWrites) return;
    const r = sn.data();
    if (demo) { if (backup && r.updatedAt > backup.updatedAt) backup = normalize(clone(r)); return; }
    if (r.updatedAt > state.updatedAt) { state = normalize(clone(r)); cacheDirty = false; saveLocal(); D = derive(state); render(); }
  }, () => { subscribed = false; setSync('error'); });
}
// Gleicht den Stand im Konto mit dem lokalen ab. Liefert true, wenn der lokale Stand hochgeladen werden muss.
function reconcile(remote) {
  if (!remote) return state.updatedAt > 0;
  const r = normalize(clone(remote));
  if (cacheDirty && state.updatedAt > r.updatedAt) {
    // Lokaler Stand ist neuer: behalten, aber nichts verlieren, was nur im Konto liegt.
    const have = new Set(state.log.map(e => e.id)), gone = new Set(tomb);
    for (const e of r.log) if (!have.has(e.id) && !gone.has(e.id)) state.log.push(e);
    for (const k of Object.keys(r.ach)) if (!state.ach[k]) state.ach[k] = r.ach[k];
    return true;
  }

}
async function pushRemote() {
  if (!docRef || demo) return;
  if (writing) { again = true; return; }
  writing = true;
  try {
    if (!remoteKnown) {
      const snap = await timeout(docRef.get(), 9000);
      remoteKnown = true;
      const need = reconcile(snap.exists ? snap.data() : null);
      D = derive(state); render(); subscribe();
      if (!need) { retried = false; setSync('cloud'); return; }
    }
    do { again = false; await docRef.set(clone(state)); } while (again);
    cacheDirty = false; tomb = []; retried = false; saveLocal(); setSync('cloud');
  } catch (e) {
    setSync('error');

}

function commit(fn, opt) {
  if (!ready) { toast('Deine Daten werden noch geladen.'); return false; }
  const before = D;
  fn(state);
  state.updatedAt = Date.now();
  D = derive(state);
  if (opt && opt.revoke) revoke(state, D);
  const ev = opt && opt.silent ? (markAll(state, D), []) : detect(before, D);
  if (opt && opt.pr && D.lift.prIds.has(opt.pr.id)) ev.unshift(Object.assign({t:'pr'}, opt.pr));
  persist(); render();
  const gain = D.xp - before.xp;
  if (gain > 0 && !(opt && opt.silent)) floatXP('+' + gain + ' XP');
  if (ev.length) play(ev); else if (gain > 0 && !(opt && opt.silent)) sfx('check');
  return true;
}
function markAll(st, d) {
  for (const w of d.weeks) {
    if (w.status === 'gold' && !st.fx.gold.includes(w.m)) st.fx.gold.push(w.m);
    if ((w.status === 'gold' || w.status === 'silber') && !st.fx.silver.includes(w.m)) st.fx.silver.push(w.m);
  }
  for (const a of ACH) if (!st.ach[a.id] && earned(a, d.stats)) st.ach[a.id] = todayKey();
  st.fx.recap = addDays(d.curM, -7);
}
function detect(before, after) {
  const ev = [], s = state;

    if (w.status === 'gold' && !s.fx.gold.includes(w.m)) { s.fx.gold.push(w.m); if (!s.fx.silver.includes(w.m)) s.fx.silver.push(w.m); ev.push({t:'gold', w}); }
    else if (w.status === 'silber' && !s.fx.silver.includes(w.m)) { s.fx.silver.push(w.m); ev.push({t:'silver', w}); }
  }
  if (after.level > before.level) ev.push({t:'level', from:before.level, to:after.level});
  const fresh = ACH.filter(a => !s.ach[a.id] && earned(a, after.stats));
  fresh.forEach(a => { s.ach[a.id] = todayKey(); });
  fresh.slice(0, 3).forEach(a => ev.push({t:'ach', a}));
  if (fresh.length > 3) ev.push({t:'more', n:fresh.length - 3});

}

  if (demo || !ready) return;
  const last = addDays(D.curM, -7), w = D.weekMap.get(last);
  const ev = [];

    const mark = () => commit(s => { s.fx.recap = last; });
    if (w.status === 'fail') ev.push({t:'fail', w, done:mark});
    else if (w.status === 'silber') ev.push({t:'silver', w, recap:true, done:mark});
    else if (w.status === 'gold' && !state.fx.gold.includes(last)) ev.push({t:'gold', w, done:mark});
  }
  if (ev.length) play(ev);
}

  else if (ev.t === 'level') { col = 'accent'; flip = true; kick = 'Level-Aufstieg'; art = '<div class="fx-hex hex">' + ev.to + '</div>'; title = 'Level ' + ev.to; const sk = SKINS.filter(k => k.req && k.req.lvl > ev.from && k.req.lvl <= ev.to).map(k => k.n); text = 'Neuer Rang: ' + rankOf(ev.to) + '.' + (sk.length ? ' Neuer Skin freigeschaltet: ' + sk.join(', ') + '.' : ''); sfx('level'); spawn(innerWidth / 2, innerHeight * .4, 60, partyColors(), 11); }

/* ---------- Demo ---------- */
function makeDemo() {
  const s = defaults(); let seed = 20261010;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const today = todayKey(), cur = mondayOf(today), notes = {u1:'Kniebeugen 5×5', u2:'neues Release, Beine brennen', u3:'Intervalle 4×8 min', u4:'lockere Runde, 40 km'};
  const plan = [['u1', 0], ['u3', 2], ['u2', 3], ['u4', 5]];
  for (let i = 25; i >= 0; i--) {
    const m = addDays(cur, -7 * i), r = rnd();
    let n = i === 0 ? 4 : i <= 5 ? (i === 3 ? 3 : 4) : r < .58 ? 4 : r < .82 ? 3 : r < .95 ? 2 : 1;
    if (i === 14) { s.skip.push(m); n = 0; }
    const picks = plan.slice().sort(() => rnd() - .5).slice(0, n).sort((a, b) => a[1] - b[1]);
    for (const [u, day] of picks) { const d = addDays(m, Math.min(6, day + (rnd() < .3 ? 1 : 0))); if (d <= today && !(i === 0 && u === 'u4')) s.log.push(Object.assign({id:newId(), d, u}, rnd() < .35 ? {note:notes[u]} : {})); }
    if (i > 0 && rnd() < .14) s.log.push({id:newId(), d:addDays(m, 6), u:'u4', note:'Bonusrunde'});
  }
  for (let i = 25; i >= 0; i--) {
    const m = addDays(cur, -7 * i); if (m > today || rnd() < .18) continue;
    for (const [x, a, b, st] of [['x1', 100, 125, 2.5], ['x2', 70, 82.5, 2.5], ['x3', 6, 10, 1]]) s.sets.push({id:newId(), d:m, x, v:Math.max(0, Math.round((a + (b - a) * (25 - i) / 25 + (rnd() - .6) * st * 2) / st) * st)});
  }
  s.updatedAt = 1;
  const d = derive(s); markAll(s, d);
  const c = d.cur; if (c && c.status !== 'gold') s.fx.gold = s.fx.gold.filter(x => x !== cur);
  return s;
}
function setDemo(on) {
  if (on === demo) return;
  if (on) { backup = state; demo = true; state = makeDemo(); }
  else { state = backup || defaults(); backup = null; demo = false; }
  selWeek = null; histMode = 'chart'; D = derive(state); tab = 'start'; render(); scrollTo(0, 0);
}

/* ---------- Backup ---------- */
async function doExport() {

  if (dl) {
    try { await dl.save({filename:name, data}); toast('Abenteuerbuch gesichert.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  if (!window.claude) {
    // Eigenständige App: Teilen-Menü (z. B. „In Dateien sichern“), sonst normaler Download.
    try {
      const f = new File([data], name, {type:'application/json'});
      if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], title:'Limit Break Abenteuerbuch'}); markBackup(); toast('Abenteuerbuch gesichert.'); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); markBackup(); toast('Abenteuerbuch gesichert.'); return;
    } catch (e) {}

}
function markBackup() { try { localStorage.setItem(LS_KEY + '.backup', todayKey()); } catch (e) {} const el = $('#syncline'); if (el) el.outerHTML = syncHTML(); }
function lastBackup() { try { const v = localStorage.getItem(LS_KEY + '.backup'); return v && DATE_RE.test(v) ? v : ''; } catch (e) { return ''; } }
function doImport(txt) {
  const err = $('#imp-err');
  try {
    const raw = JSON.parse(txt);
    if (!raw || !Array.isArray(raw.units) || !Array.isArray(raw.log)) throw 0;
    const n = normalize(raw);
    if (commit(s => { for (const k of Object.keys(s)) delete s[k]; Object.assign(s, n); }, {silent:true})) { closeSheet(); toast('Abenteuerbuch geladen: ' + n.log.length + ' Einheiten.'); }
  } catch (e) { if (err) { err.textContent = 'Das ist kein gültiges Abenteuerbuch. Wähle die gesicherte .json-Datei oder füge ihren vollständigen Inhalt ein.'; err.hidden = false; } }
}

function editEntry(id) { const e = state.log.find(x => x.id === id); if (e) openSheet({t:'entry', edit:true, draft:{id:e.id, u:e.u, d:e.d, note:e.note || ''}}); }

  st.fx.silver = st.fx.silver.filter(m => st2(m) === 'gold' || st2(m) === 'silber');
